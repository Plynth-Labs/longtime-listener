app = "longtime-listener"
primary_region = "sjc"
# The app flushes open archives on SIGTERM and allows itself 35 seconds. The
# supervisor waits 40. The platform has to outwait both or a machine stop loses
# a saved episode.
kill_signal = "SIGTERM"
kill_timeout = "45s"

[build]

[env]
  NEWSCAST_DATA_DIR = "/data"
  HOST = "127.0.0.1"
  PORT = "4310"
  NEWSCAST_PUBLIC_HOST = "0.0.0.0"
  NEWSCAST_PUBLIC_PORT = "8080"
  NEWSCAST_PUBLIC_UPSTREAM = "http://127.0.0.1:4310/api/"
  NEWSCAST_PUBLIC_ORIGIN = "https://drop.jonomatus.ky"
  # An episode costs roughly one unit to start plus one per delivered segment,
  # so this is about seven episodes an hour across everyone and about two for
  # any one listener. The laptop ran 240/120, which was sized for an obscure URL
  # rather than an always-on host. Raise after watching real usage, not before.
  NEWSCAST_PUBLIC_MAX_WORK_PER_HOUR = "60"
  NEWSCAST_PUBLIC_MAX_CLIENT_WORK_PER_HOUR = "20"
  # On the volume, not in memory. Machines below are allowed to stop when idle,
  # and an hourly ceiling that resets on every restart is a per-burst ceiling
  # with as many bursts an hour as someone cares to wait for.
  NEWSCAST_PUBLIC_BUDGET_FILE = "/data/admission-budget.json"
  # Fly's proxy writes the caller's address here. X-Forwarded-For keeps
  # whatever the caller sent, so keying on it hands out a budget per request.
  NEWSCAST_PUBLIC_CLIENT_IP_HEADER = "fly-client-ip"

# Saved shows, listener profiles, archived episodes and the permanent speech
# cache. The cache has no eviction job, so this only ever grows.
[[mounts]]
  source = "newscast_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  # Nobody is listening most of the time, and the boot-time speech warmup reads
  # the volume rather than re-rendering, so a cold start is cheap after the
  # first one. Raise to 1 if first-visitor latency ever matters more than idle cost.
  min_machines_running = 0

  # Mirrors the gateway's own 64-connection ceiling.
  [http_service.concurrency]
    type = "connections"
    hard_limit = 64
    soft_limit = 48

  # /ready, not /health: the platform keeps routing to whatever passes this
  # check, and /health only proves the gateway process is alive. /ready probes
  # the app behind it, so a hung upstream stops taking traffic instead of
  # handing every visitor a 502.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "8s"
    method = "GET"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
